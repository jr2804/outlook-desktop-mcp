[project]
name = "outlook-desktop-mcp"
dynamic = ["version"]
description = "Outlook Desktop as an MCP server — Windows (COM) and macOS (AppleScript). No Graph API, no Entra app registration — just your local Outlook."
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.13"
authors = [
    { name = "Andreas Martin Aanerud", email = "aaanerud@microsoft.com" },
]
keywords = ["mcp", "outlook", "email", "com", "applescript", "automation", "windows", "macos", "microsoft", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "pywin32>=310; sys_platform == 'win32'",
    "fastmcp",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/aaanerud/outlook-desktop-mcp"
Repository = "https://github.com/aaanerud/outlook-desktop-mcp"
Issues = "https://github.com/aaanerud/outlook-desktop-mcp/issues"

[project.scripts]
outlook-desktop-mcp = "outlook_desktop_mcp.entrypoint:main"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_desktop_mcp"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
# Versioning scheme: CalVer `YYYY.M.N`.
# - `VERSION` is the source of truth (a single line, e.g. "2026.8.3").
# - Git tags of the form `vYYYY.M.N` are recognised by `tag-pattern` and
#   override the file value at release time.
# - A GitHub Action (`.github/workflows/version-bump.yml`) auto-increments
#   the patch (N) on every push to `main`, rolling the month/year forward
#   when they change.
from_file = { source = "VERSION" }
tag-pattern = "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"
fallback-version = "0.0.0"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
# The MCP server's tools are async def; auto-mode lets async tests run
# without per-test markers. COM integration tests (*_com_test.py) still
# require a live Windows/macOS Outlook and are skipped/no-op on Linux.
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"

[tool.pytest-cov]
addopts = "--cov=outlook_desktop_mcp --cov-report=term-missing --cov-report=html --cov-report=xml"

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"

[tool.undersort]
# Method visibility ordering: public (no underscore), protected (single underscore), private (double underscore)
order = ["public", "protected", "private"]
# Method type ordering within each visibility level
method_type_order = ["instance", "class", "static"]
